apiVersion: v1
kind: ConfigMap
metadata:
  name: smartcampus-db-init
  namespace: smartcampus
data:
  10-init.sql: |
    -- Esquema compatible con los modelos SQLAlchemy Room y Booking.
    -- IF NOT EXISTS permite que SQLAlchemy también cree las tablas al iniciar.
    CREATE TABLE IF NOT EXISTS rooms (
        id SERIAL PRIMARY KEY,
        nombre VARCHAR(150) NOT NULL,
        edificio VARCHAR(150) NOT NULL,
        capacidad INTEGER NOT NULL,
        equipamiento JSON NOT NULL
    );

    CREATE TABLE IF NOT EXISTS bookings (
        id SERIAL PRIMARY KEY,
        aula_id INTEGER NOT NULL REFERENCES rooms (id),
        usuario VARCHAR(150) NOT NULL,
        fecha DATE NOT NULL,
        hora_inicio TIME NOT NULL,
        hora_fin TIME NOT NULL
    );

    CREATE INDEX IF NOT EXISTS ix_rooms_id ON rooms (id);
    CREATE INDEX IF NOT EXISTS ix_bookings_id ON bookings (id);
    CREATE INDEX IF NOT EXISTS ix_bookings_aula_id ON bookings (aula_id);

    INSERT INTO rooms (id, nombre, edificio, capacidad, equipamiento)
    VALUES
        (1, 'Aula Magna', 'Edificio Central', 180, '["proyector", "sonido", "pizarra"]'),
        (2, 'Aula 101', 'Edificio de Ingenieria', 40, '["proyector", "pizarra"]'),
        (3, 'Laboratorio de Informatica', 'Edificio de Ingenieria', 32, '["ordenadores", "proyector"]'),
        (4, 'Aula 204', 'Edificio de Ciencias', 55, '["pantalla", "pizarra"]'),
        (5, 'Sala de Estudio Norte', 'Biblioteca Universitaria', 24, '["enchufes", "pantalla"]')
    ON CONFLICT (id) DO NOTHING;

    INSERT INTO bookings (id, aula_id, usuario, fecha, hora_inicio, hora_fin)
    VALUES
        (1, 2, 'alumno001', DATE '2026-11-02', TIME '09:00:00', TIME '10:30:00'),
        (2, 3, 'docente001', DATE '2026-11-02', TIME '11:00:00', TIME '13:00:00'),
        (3, 5, 'alumno002', DATE '2026-11-03', TIME '15:00:00', TIME '16:00:00')
    ON CONFLICT (id) DO NOTHING;

    -- Alinea las secuencias tras insertar identificadores explícitos.
    SELECT setval(
        pg_get_serial_sequence('rooms', 'id'),
        COALESCE((SELECT MAX(id) FROM rooms), 1),
        EXISTS (SELECT 1 FROM rooms)
    );

    SELECT setval(
        pg_get_serial_sequence('bookings', 'id'),
        COALESCE((SELECT MAX(id) FROM bookings), 1),
        EXISTS (SELECT 1 FROM bookings)
    );
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql-headless
  namespace: smartcampus
spec:
  clusterIP: None
  selector:
    app: postgresql
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: smartcampus
spec:
  type: ClusterIP
  selector:
    app: postgresql
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: smartcampus
spec:
  serviceName: postgresql-headless
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
        - name: postgresql
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: smartcampus-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: smartcampus-db-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartcampus-db-credentials
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: db-init
              mountPath: /docker-entrypoint-initdb.d/10-init.sql
              subPath: 10-init.sql
              readOnly: true
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: db-init
          configMap:
            name: smartcampus-db-init
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
